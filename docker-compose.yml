services:
  web:
    build:
      context: .
    container_name: causal-inference-platform
    restart: unless-stopped
    env_file:
      - .env
    environment:
      FLASK_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
